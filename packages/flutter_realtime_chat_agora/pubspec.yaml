name: flutter_realtime_chat_agora
description: Agora Chat adapter for flutter_realtime_chat_core.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/lengsukq/flutter_multi_livestream_video

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_realtime_chat_core:
    path: ../flutter_realtime_chat_core
  agora_chat_sdk: ^1.4.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: AgoraChatMacOSPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
