name: flutter_realtime_sdk_runtime
description: Provider-neutral realtime orchestration and explicitly registered SDK entry point.
version: 0.1.0
publish_to: none
repository: https://github.com/lengsukq/multi-video
issue_tracker: https://github.com/lengsukq/multi-video/issues
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter_realtime_foundation:
    path: ../flutter_realtime_foundation
  flutter_realtime_interaction_core:
    path: ../flutter_realtime_interaction_core
  flutter:
    sdk: flutter
  flutter_realtime_media_core:
    path: ../flutter_realtime_media_core
  flutter_realtime_chat_core:
    path: ../flutter_realtime_chat_core
  flutter_realtime_chat_rtc:
    path: ../flutter_realtime_chat_rtc
  web: ^1.1.1
dev_dependencies:
  flutter_realtime_video_effects:
    path: ../flutter_realtime_video_effects
  flutter_realtime_shared_content_preset:
    path: ../flutter_realtime_shared_content_preset
  flutter_realtime_screen_annotation:
    path: ../flutter_realtime_screen_annotation
  flutter_realtime_whiteboard_core:
    path: ../flutter_realtime_whiteboard_core
  flutter_realtime_classroom_core:
    path: ../flutter_realtime_classroom_core
  flutter_realtime_live_core:
    path: ../flutter_realtime_live_core
  flutter_realtime_classroom_preset:
    path: ../flutter_realtime_classroom_preset
  flutter_realtime_live_preset:
    path: ../flutter_realtime_live_preset
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
