name: flutter_realtime_media_web
description: Browser JavaScript SDK adapters for the realtime media providers.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/lengsukq/flutter_multi_livestream_video

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter_realtime_foundation:
    path: ../flutter_realtime_foundation
  flutter:
    sdk: flutter
  flutter_realtime_media_core:
    path: ../flutter_realtime_media_core
  flutter_realtime_processed_video:
    path: ../flutter_realtime_processed_video
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/media-provider-bridge.js
