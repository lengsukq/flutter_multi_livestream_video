name: flutter_realtime_sdk_ui
description: Optional room and system toolbar UI composition.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'
dependencies:
  flutter_realtime_foundation:
    path: ../flutter_realtime_foundation
  flutter:
    sdk: flutter
  flutter_realtime_sdk_runtime:
    path: ../flutter_realtime_sdk_runtime
  flutter_realtime_media_core:
