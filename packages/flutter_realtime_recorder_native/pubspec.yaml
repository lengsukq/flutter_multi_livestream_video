name: flutter_realtime_recorder_native
description: Optional native system-display recording driver for the provider-neutral Realtime SDK.
version: 0.1.0
publish_to: none
repository: https://github.com/lengsukq/flutter_multi_livestream_video
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_realtime_media_core:
    path: ../flutter_realtime_media_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.oneplusdream.flutter_realtime_recorder_native
        pluginClass: FlutterRealtimeRecorderNativePlugin
      macos:
        pluginClass: FlutterRealtimeRecorderNativePlugin
