name: flutter_realtime_classroom_ui
description: Optional classroom teacher and student widgets for realtime SDK.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter_realtime_design_ui:
    path: ../flutter_realtime_design_ui
  flutter_realtime_foundation:
    path: ../flutter_realtime_foundation
  flutter_realtime_whiteboard_ui:
    path: ../flutter_realtime_whiteboard_ui
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  flutter_realtime_classroom_core:
    path: ../flutter_realtime_classroom_core
  flutter_realtime_media_ui:
    path: ../flutter_realtime_media_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

