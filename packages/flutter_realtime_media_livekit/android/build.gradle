group = "com.oneplusdream.flutter_realtime_media_livekit"
version = "1.0-SNAPSHOT"

apply plugin: "com.android.library"

android {
    namespace "com.oneplusdream.flutter_realtime_media_livekit"
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24
    }
}

dependencies {
    implementation project(':flutter_realtime_video_effects')
    implementation project(':flutter_webrtc')
    // flutter_webrtc keeps its WebRTC classes as an implementation dependency.
    compileOnly 'io.github.webrtc-sdk:android:150.7871.01'
}
