name: flutter_realtime_media_trtc
description: Optional Tencent TRTC adapter for flutter_realtime_media_core.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_realtime_processed_video:
    path: ../flutter_realtime_processed_video
  flutter_realtime_media_core:
    path: ../flutter_realtime_media_core
  tencent_rtc_sdk: ^13.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.oneplusdream.flutter_realtime_media_trtc
        pluginClass: FlutterRealtimeMediaTrtcPlugin
      macos:
        pluginClass: FlutterRealtimeMediaTrtcPlugin
      ios:
        pluginClass: FlutterRealtimeMediaTrtcPlugin
      windows:
        pluginClass: FlutterRealtimeMediaTrtcPluginCApi
