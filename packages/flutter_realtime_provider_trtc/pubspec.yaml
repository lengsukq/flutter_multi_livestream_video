name: flutter_realtime_provider_trtc
description: Optional trtc platform drivers and bundled Web runtime.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_realtime_processed_video:
    path: ../flutter_realtime_processed_video
  flutter_realtime_video_effects:
    path: ../flutter_realtime_video_effects
  flutter_realtime_sdk_runtime:
    path: ../flutter_realtime_sdk_runtime
  flutter_realtime_media_trtc:
    path: ../flutter_realtime_media_trtc
  flutter_realtime_media_web:
    path: ../flutter_realtime_media_web
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  assets:
    - assets/
    - assets/licenses/
    - assets/trtc-assets/
    - assets/trtc-assets/mediapipe/
