name: flutter_realtime_sdk_base
description: Provider-neutral realtime orchestration and explicitly registered SDK entry point.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_realtime_media_core:
    path: ../flutter_realtime_media_core
  flutter_realtime_media_ui:
    path: ../flutter_realtime_media_ui
  flutter_realtime_chat_core:
    path: ../flutter_realtime_chat_core
  flutter_realtime_chat_rtc:
    path: ../flutter_realtime_chat_rtc
  flutter_realtime_video_effects:
    path: ../flutter_realtime_video_effects
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
