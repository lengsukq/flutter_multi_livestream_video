name: flutter_realtime_media_aws_desktop
description: Internal macOS WebKit media driver for AWS Chime and IVS Real-Time.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/lengsukq/flutter_multi_livestream_video
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterRealtimeMediaAwsDesktopPlugin
