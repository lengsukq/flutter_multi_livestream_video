name: flutter_realtime_sdk
description: Lightweight provider-neutral Flutter realtime SDK entry point. Add UI and provider packages explicitly.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/lengsukq/flutter_multi_livestream_video
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_realtime_sdk_runtime:
    path: ../flutter_realtime_sdk_runtime
dev_dependencies:
  flutter_realtime_classroom_preset:
    path: ../flutter_realtime_classroom_preset
  flutter_realtime_live_preset:
    path: ../flutter_realtime_live_preset
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Integration tests exercise optional packages, but production consumers
  # never acquire providers or UI transitively from this SDK entry point.
  flutter_realtime_sdk_ui:
    path: ../flutter_realtime_sdk_ui
  flutter_realtime_provider_livekit:
    path: ../flutter_realtime_provider_livekit
  flutter_realtime_provider_agora:
    path: ../flutter_realtime_provider_agora
  flutter_realtime_provider_trtc:
    path: ../flutter_realtime_provider_trtc
  flutter_realtime_provider_artc:
    path: ../flutter_realtime_provider_artc
  flutter_realtime_provider_aws:
    path: ../flutter_realtime_provider_aws
  flutter_realtime_provider_agora_chat:
    path: ../flutter_realtime_provider_agora_chat
  flutter_realtime_provider_ivs_chat:
    path: ../flutter_realtime_provider_ivs_chat
  flutter_realtime_provider_tencent_chat:
    path: ../flutter_realtime_provider_tencent_chat
  flutter_realtime_chat_rtc:
    path: ../flutter_realtime_chat_rtc
  flutter_realtime_video_effects:
    path: ../flutter_realtime_video_effects
  flutter_realtime_media_core:
    path: ../flutter_realtime_media_core
flutter:
  uses-material-design: true
