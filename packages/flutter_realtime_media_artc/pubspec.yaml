name: flutter_realtime_media_artc
description: Optional Alibaba Cloud ARTC adapter for flutter_realtime_media_core.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_realtime_media_core:
    path: ../flutter_realtime_media_core

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.oneplusdream.flutter_realtime_media_artc
        pluginClass: FlutterRealtimeMediaArtcPlugin
      ios:
        pluginClass: FlutterRealtimeMediaArtcPlugin
