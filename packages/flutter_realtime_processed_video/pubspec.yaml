name: flutter_realtime_processed_video
description: Lightweight provider-neutral processed frame binding and preview.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_realtime_media_core:
    path: ../flutter_realtime_media_core
  web: ^1.1.1
flutter:
  assets:
    - assets/processed-video-bridge.js
  plugin:
    platforms:
      android:
        package: com.oneplusdream.flutter_realtime_processed_video
        pluginClass: FlutterRealtimeProcessedVideoPlugin
      macos:
        pluginClass: FlutterRealtimeProcessedVideoPlugin
      ios:
        pluginClass: FlutterRealtimeProcessedVideoPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
