name: Windows virtual-background native build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/flutter_realtime_video_effects/**"
      - "packages/flutter_realtime_processed_video/**"
      - "packages/flutter_realtime_media_livekit/**"
      - "packages/flutter_realtime_media_agora/**"
      - "packages/flutter_realtime_media_trtc/**"
      - "packages/flutter_webrtc/**"
      - "scripts/assemble_single_sdk_desktop.py"
      - ".github/workflows/windows-video-effects-smoke.yml"

jobs:
  windows-effects:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Flutter Windows configuration
        shell: pwsh
        run: |
          flutter doctor -v
          flutter config --enable-windows-desktop
          flutter --version
      - name: Windows effect compositor C++ tests
        shell: pwsh
        run: |
          cmake --version
          $source = "packages/flutter_realtime_processed_video/windows/test"
          New-Item -ItemType Directory -Force -Path build/windows-effects-tests | Out-Null
          foreach ($test in @("processed_video_frame_hub_test", "processed_video_compositor_test", "processed_video_i420_test")) {
            cl /nologo /std:c++17 /EHsc /W4 /WX "$source/$test.cpp" "/Febuild/windows-effects-tests/$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "C++ compile failed: $test" }
            & "build/windows-effects-tests/$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "C++ test failed: $test" }
          }
      - name: Build all three Windows processed-video provider plugins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-effects-smoke | Out-Null
          Push-Location build/windows-effects-smoke
          flutter create --platforms=windows --project-name effects_smoke .
          if ($LASTEXITCODE -ne 0) { throw "flutter create failed" }
          $manifest = Get-Content pubspec.yaml -Raw
          $dependencies = @(
            "  flutter_realtime_video_effects:",
            "    path: ../../packages/flutter_realtime_video_effects",
            "  flutter_realtime_media_livekit:",
            "    path: ../../packages/flutter_realtime_media_livekit",
            "  flutter_realtime_media_agora:",
            "    path: ../../packages/flutter_realtime_media_agora",
            "  flutter_realtime_media_trtc:",
            "    path: ../../packages/flutter_realtime_media_trtc"
          ) -join "`n"
          $manifest = $manifest -replace '(?m)^dependencies:\s*$', "dependencies:`n$dependencies"
          $manifest += "`ndependency_overrides:`n  flutter_webrtc:`n    path: ../../packages/flutter_webrtc`n"
          Set-Content -Path pubspec.yaml -Value $manifest -Encoding utf8
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw "pub get failed" }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "native Windows build failed" }
          Pop-Location

# The default smoke build checks Windows C++/CMake without an ONNX Runtime
# distribution. Native isSupported correctly reports false in that configuration.
# A separate hardware acceptance run must configure REALTIME_ONNXRUNTIME_ROOT
# and verify actual inference, Texture preview, and WebRTC remote publication.
