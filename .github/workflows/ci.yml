name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DASH__SUPPRESS_ANALYTICS: 'true'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: packages
        run: echo "packages=$(python3 -c 'import json; print(json.dumps(json.load(open("scripts/sdk_packages.json"))))')" >> "$GITHUB_OUTPUT"

  quality-and-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_aws_chime
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Check formatting
        run: python3 scripts/format_sdk.py --check

      - name: Test build and quality helpers
        run: python3 -m unittest discover -s scripts/tests

      - name: Check SDK architecture
        run: python3 scripts/check_sdk_architecture.py

      - name: Resolve example dependencies
        working-directory: flutter_aws_chime/example
        run: flutter pub get

      - name: Resolve SDK dependencies
        working-directory: flutter_aws_chime/packages/flutter_realtime_sdk
        run: flutter pub get

      - name: Analyze SDK and Demo
        run: |
          (cd packages/flutter_realtime_sdk && flutter analyze --no-pub)
          (cd example && flutter analyze --no-pub)

      - name: Build Android example with built-in Kotlin
        working-directory: flutter_aws_chime/example
        run: flutter build apk --debug

      - name: Test Android video frame processing
        working-directory: flutter_aws_chime/example/android
        run: ./gradlew :flutter_realtime_video_effects:testDebugUnitTest :flutter_realtime_video_effects:externalNativeBuildDebug

  package-tests:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.inventory.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve project dependencies
        working-directory: flutter_aws_chime/packages/${{ matrix.project }}
        run: flutter pub get

      - name: Analyze project
        working-directory: flutter_aws_chime/packages/${{ matrix.project }}
        run: python3 ../../scripts/check_sdk_quality.py --analyze --package ${{ matrix.project }}

      - name: Run project tests
        working-directory: flutter_aws_chime/packages/${{ matrix.project }}
        run: python3 ../../scripts/check_sdk_quality.py --test --package ${{ matrix.project }}

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build standard JavaScript Web example
        working-directory: flutter_aws_chime/example
        run: |
          flutter pub get
          flutter build web --release

  web-sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve SDK dependencies
        working-directory: flutter_aws_chime/packages/flutter_realtime_sdk
        run: flutter pub get

      - name: Test Web platform catalog in Chrome
        working-directory: flutter_aws_chime/packages/flutter_realtime_sdk
        run: flutter test --platform chrome --no-pub

  ios:
    runs-on: macos-26
    env:
      DASH__SUPPRESS_ANALYTICS: 'true'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    defaults:
      run:
        working-directory: flutter_aws_chime
    steps:
      - uses: actions/checkout@v4
        with:
          # Flutter currently derives local SwiftPM package identity from the
          # checkout directory. Keep it equal to the pub package name until
          # flutter/flutter#186881 is fixed.
          path: flutter_aws_chime

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Build iOS device target without codesigning
        working-directory: flutter_aws_chime/example
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Validate CocoaPods podspec
        run: >-
          pod lib lint packages/flutter_aws_chime/ios/flutter_aws_chime.podspec
          --configuration=Debug
          --skip-tests
          --allow-warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve example dependencies
        working-directory: flutter_aws_chime/example
        run: flutter pub get

      - name: Materialize Agora plugin for Windows SDK extraction
        working-directory: flutter_aws_chime/example
        shell: pwsh
        run: |
          $pluginPath = "windows/flutter/ephemeral/.plugin_symlinks/agora_rtc_engine"
          if (-not (Test-Path -LiteralPath $pluginPath)) {
            throw "Expected Flutter's Agora plugin link at $pluginPath"
          }

          $pluginItem = Get-Item -LiteralPath $pluginPath -Force
          if (-not $pluginItem.Target) {
            Write-Host "Agora plugin is already a real directory."
            exit 0
          }

          $pluginTarget = @($pluginItem.Target)[0]
          if (-not [System.IO.Path]::IsPathRooted($pluginTarget)) {
            $pluginTarget = Join-Path $pluginItem.Parent.FullName $pluginTarget
          }
          $pluginSource = (Resolve-Path -LiteralPath $pluginTarget).Path

          Remove-Item -LiteralPath $pluginPath -Force
          New-Item -ItemType Directory -Path $pluginPath | Out-Null
          Get-ChildItem -LiteralPath $pluginSource -Force |
            Copy-Item -Destination $pluginPath -Recurse -Force

      - name: Build Windows example
        working-directory: flutter_aws_chime/example
        run: flutter build windows --release

  javascript-and-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo-server/package-lock.json
      - name: Install declared backend dependencies
        working-directory: demo-server
        run: npm ci
      - name: Check backend contracts
        working-directory: demo-server
        run: npm run check
      - name: Test browser and desktop bridges
        run: >-
          node --test
          packages/flutter_realtime_video_effects/test/web_bridge_test.mjs
          packages/flutter_realtime_media_aws_desktop/test/aws_desktop_runtime_test.mjs
          packages/flutter_realtime_sdk/tool/provider_bridge/src/*.test.js

  macos:
    runs-on: macos-26
    env:
      DASH__SUPPRESS_ANALYTICS: 'true'
      FLUTTER_SWIFT_PACKAGE_MANAGER: 'false'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve example dependencies
        working-directory: flutter_aws_chime/example
        run: flutter pub get
      - name: Build macOS example with CocoaPods
        working-directory: flutter_aws_chime/example
        run: python3 ../scripts/build_flutter_macos.py --debug --no-pub
      - name: Test native macOS frame feed
        working-directory: flutter_aws_chime
        run: packages/flutter_realtime_media_aws_desktop/test/run_macos_native_frame_feed_test.sh

  generated-docs-and-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated capability declarations
        run: python3 scripts/generate_capability_matrix.py --check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build lightweight examples and verify provider pruning
        run: |
          for project in examples/lite_media examples/lite_media_chat; do
            (cd "$project" && flutter pub get && flutter analyze --no-pub && flutter build web --release --no-pub)
          done
          python3 scripts/check_lite_artifacts.py
