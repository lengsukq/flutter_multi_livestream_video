name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_aws_chime
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test packages example/lib example/test example/integration_test

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Pub.dev dry run
        run: flutter pub publish --dry-run

      - name: Resolve example dependencies
        working-directory: flutter_aws_chime/example
        run: flutter pub get

      - name: Resolve SDK dependencies
        working-directory: flutter_aws_chime/packages/flutter_realtime_sdk
        run: flutter pub get

      - name: Analyze SDK and Demo
        run: |
          (cd packages/flutter_realtime_sdk && flutter analyze --no-pub)
          (cd example && flutter analyze --no-pub)

      - name: Build Android example with built-in Kotlin
        working-directory: flutter_aws_chime/example
        run: flutter build apk --debug

      - name: Build standard JavaScript Web example
        working-directory: flutter_aws_chime/example
        run: flutter build web --release

  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - packages/flutter_realtime_chat_agora
          - packages/flutter_realtime_chat_core
          - packages/flutter_realtime_chat_ivs
          - packages/flutter_realtime_chat_rtc
          - packages/flutter_realtime_chat_tencent
          - packages/flutter_realtime_media_agora
          - packages/flutter_realtime_media_artc
          - packages/flutter_realtime_media_chime
          - packages/flutter_realtime_media_core
          - packages/flutter_realtime_media_ivs
          - packages/flutter_realtime_media_livekit
          - packages/flutter_realtime_media_trtc
          - packages/flutter_realtime_media_ui
          - packages/flutter_realtime_media_web
          - packages/flutter_realtime_sdk
          - example
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve project dependencies
        working-directory: flutter_aws_chime/${{ matrix.project }}
        run: flutter pub get

      - name: Run project tests
        working-directory: flutter_aws_chime/${{ matrix.project }}
        run: |
          if [ -d test ]; then
            flutter test --no-pub
          else
            flutter analyze --no-pub
          fi

  web-sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve SDK dependencies
        working-directory: flutter_aws_chime/packages/flutter_realtime_sdk
        run: flutter pub get

      - name: Test Web platform catalog in Chrome
        working-directory: flutter_aws_chime/packages/flutter_realtime_sdk
        run: flutter test --platform chrome --no-pub

  ios:
    runs-on: macos-26
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    defaults:
      run:
        working-directory: flutter_aws_chime
    steps:
      - uses: actions/checkout@v4
        with:
          # Flutter currently derives local SwiftPM package identity from the
          # checkout directory. Keep it equal to the pub package name until
          # flutter/flutter#186881 is fixed.
          path: flutter_aws_chime

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Build iOS device target without codesigning
        working-directory: flutter_aws_chime/example
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Build macOS example with CocoaPods
        working-directory: flutter_aws_chime/example
        run: flutter build macos

      - name: Validate CocoaPods podspec
        run: >-
          pod lib lint ios/flutter_aws_chime.podspec
          --configuration=Debug
          --skip-tests
          --allow-warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_aws_chime

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve example dependencies
        working-directory: flutter_aws_chime/example
        run: flutter pub get

      - name: Materialize Agora plugin for Windows SDK extraction
        working-directory: flutter_aws_chime/example
        shell: pwsh
        run: |
          $pluginPath = "windows/flutter/ephemeral/.plugin_symlinks/agora_rtc_engine"
          if (-not (Test-Path -LiteralPath $pluginPath)) {
            throw "Expected Flutter's Agora plugin link at $pluginPath"
          }

          $pluginItem = Get-Item -LiteralPath $pluginPath -Force
          if (-not $pluginItem.Target) {
            Write-Host "Agora plugin is already a real directory."
            exit 0
          }

          $pluginTarget = @($pluginItem.Target)[0]
          if (-not [System.IO.Path]::IsPathRooted($pluginTarget)) {
            $pluginTarget = Join-Path $pluginItem.Parent.FullName $pluginTarget
          }
          $pluginSource = (Resolve-Path -LiteralPath $pluginTarget).Path

          Remove-Item -LiteralPath $pluginPath -Force
          New-Item -ItemType Directory -Path $pluginPath | Out-Null
          Get-ChildItem -LiteralPath $pluginSource -Force |
            Copy-Item -Destination $pluginPath -Recurse -Force

      - name: Build Windows example
        working-directory: flutter_aws_chime/example
        run: flutter build windows --release
