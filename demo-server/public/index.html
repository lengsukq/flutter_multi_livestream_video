<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chime Live Console · 智能直播控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-bg-hover: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-border-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --primary-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c026d3 100%);
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --glass-blur: blur(20px);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* Ambient Lighting Background */
    .ambient-glow {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      transition: all 1s ease;
    }
    .glow-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
      top: -150px;
      left: -100px;
    }
    .glow-2 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #d946ef 0%, rgba(217, 70, 239, 0) 70%);
      bottom: -150px;
      right: -100px;
    }
    .glow-3 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.2;
    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 32px 24px;
      position: relative;
      z-index: 1;
    }

    /* Glass Panels */
    .glass {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card {
      padding: 24px;
      margin-bottom: 24px;
    }

    .glass:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      margin-bottom: 32px;
      border-radius: var(--radius-xl);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .brand-logo svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .brand-info h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-info p {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
      font-size: 12px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .region-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #cbd5e1;
    }

    /* KPI Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      padding: 24px;
      border-radius: var(--radius-lg);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--stat-accent, var(--primary-gradient));
      opacity: 0.8;
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .stat-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--stat-color, #a855f7);
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Control Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 32px;
    }

    .create-group {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 320px;
    }

    .input-glass {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-pill);
      padding: 12px 20px;
      font-size: 14px;
      color: #fff;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
      flex: 1;
    }

    .input-glass:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(15, 23, 42, 0.7);
    }

    .input-glass::placeholder {
      color: #64748b;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      padding: 12px 22px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.45);
    }

    .btn-primary:hover {
      box-shadow: 0 12px 28px -2px rgba(99, 102, 241, 0.6);
      transform: translateY(-1px);
    }

    .btn-glass {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger-glass {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.3);
      color: #fb7185;
      padding: 8px 16px;
      font-size: 13px;
    }

    .btn-danger-glass:hover {
      background: rgba(244, 63, 94, 0.22);
      border-color: rgba(244, 63, 94, 0.5);
      color: #fff;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 13px;
    }

    /* Section Headers */
    .section-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-count {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      font-size: 12px;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-weight: 700;
    }

    /* Modern Table & Room Cards */
    .table-responsive {
      overflow-x: auto;
      border-radius: var(--radius-lg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
      vertical-align: middle;
    }

    tbody tr {
      transition: background-color 0.2s ease;
    }

    tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .room-badge {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
    }

    .room-code-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
    }

    .meeting-id-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #64748b;
    }

    .attendee-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 380px;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      color: #c7d2fe;
    }

    .user-chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #818cf8;
    }

    .action-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Event Console */
    .console-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      line-height: 1.6;
      max-height: 300px;
      overflow-y: auto;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
    }

    .console-box::-webkit-scrollbar {
      width: 6px;
    }
    .console-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .event-line {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .event-line:last-child {
      border-bottom: none;
    }

    .event-ts {
      color: #64748b;
      font-size: 11px;
      flex-shrink: 0;
    }

    .event-tag {
      padding: 1px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .tag-room-create { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .tag-attendee-join { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .tag-room-close, .tag-room-close-force { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
    .tag-room-close-idle { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .tag-default { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }

    .event-msg {
      color: #e2e8f0;
      word-break: break-all;
    }

    /* Toast Notification */
    #toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      border-radius: var(--radius-pill);
      padding: 12px 22px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateX(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }

    .toast.success { border-color: rgba(16, 185, 129, 0.4); color: #6ee7b7; }
    .toast.error { border-color: rgba(244, 63, 94, 0.4); color: #fda4af; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      stroke: #475569;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .create-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <div id="toast-container"></div>

  <div class="container">
    <!-- Header -->
    <header class="glass">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1>Chime Live Console</h1>
          <p>
            <span class="status-badge"><span class="pulse-dot"></span>服务就绪</span>
            <span id="header-meta">正在拉取节点拓扑...</span>
          </p>
        </div>
      </div>
      <div class="header-actions">
        <div class="region-chip" id="region-tags">Region: us-east-1 / ap-southeast-1</div>
        <button class="btn btn-glass btn-sm" onclick="refresh()" id="refresh-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
          刷新
        </button>
      </div>
    </header>

    <!-- KPI Metric Cards -->
    <div class="stats-grid">
      <div class="glass stat-card" style="--stat-accent: linear-gradient(90deg, #06b6d4, #3b82f6); --stat-color: #06b6d4;">
        <div class="stat-header">
          <span class="stat-title">活跃房间数</span>
          <div class="stat-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          </div>
        </div>
        <div class="stat-value" id="c-rooms">–</div>
        <div class="stat-subtitle">当前正在推流或保持心跳的房间</div>
      </div>

      <div class="glass stat-card" style="--stat-accent: linear-gradient(90deg, #8b5cf6, #d946ef); --stat-color: #a855f7;">
        <div class="stat-header">
          <span class="stat-title">加入人次（累计）</span>
          <div class="stat-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          </div>
        </div>
        <div class="stat-value" id="c-att">–</div>
        <div class="stat-subtitle">计费以真人进入产生的 attendee-minute 为准</div>
      </div>

      <div class="glass stat-card" style="--stat-accent: linear-gradient(90deg, #10b981, #14b8a6); --stat-color: #10b981;">
        <div class="stat-header">
          <span class="stat-title">后端运行时间</span>
          <div class="stat-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
        </div>
        <div class="stat-value" id="c-up">–</div>
        <div class="stat-subtitle" id="c-started">服务已平稳启动</div>
      </div>
    </div>

    <!-- Quick Action Bar -->
    <div class="glass toolbar">
      <div class="create-group">
        <input id="new-code" class="input-glass" placeholder="房间号（4-12位数字/字母，不填则系统自动分配）" autocomplete="off" />
        <button class="btn btn-primary" onclick="createRoom()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          创建房间
        </button>
      </div>
      <div style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">
        <span>5 秒自动同步</span>
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #6366f1;"></div>
      </div>
    </div>

    <!-- Room List Table -->
    <div class="section-title-bar">
      <div class="section-title">
        <span>实时房间列表</span>
        <span class="badge-count" id="room-badge-count">0</span>
      </div>
    </div>

    <div class="glass table-responsive glass-card" style="padding: 0; margin-bottom: 32px;">
      <table>
        <thead>
          <tr>
            <th>房间号 / 标识</th>
            <th>在线人数</th>
            <th>参会成员</th>
            <th>空闲时长</th>
            <th>创建时间</th>
            <th>管理操作</th>
          </tr>
        </thead>
        <tbody id="rooms">
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <p>当前暂无活跃房间，可通过上方快速创建</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Realtime Events Console -->
    <div class="section-title-bar">
      <div class="section-title">
        <span>实时系统事件日志</span>
      </div>
      <div style="font-size: 12px; color: var(--text-muted);">保留最近 100 条</div>
    </div>

    <div class="glass glass-card" style="padding: 16px;">
      <div class="console-box" id="events">
        <div class="event-line"><span class="event-msg" style="color: #64748b;">日志初始化中...</span></div>
      </div>
    </div>
  </div>

  <script>
    let timer = null;

    function toast(text, type = 'info') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = text;
      c.appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 350);
      }, 3500);
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
      }[c]));
    }

    function formatTime(isoStr) {
      if (!isoStr) return '—';
      try {
        const d = new Date(isoStr);
        return d.toLocaleTimeString('zh-CN', { hour12: false }) + ' (' + d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) + ')';
      } catch {
        return esc(isoStr);
      }
    }

    function eventTagClass(type) {
      switch (type) {
        case 'room-create': return 'tag-room-create';
        case 'attendee-join': return 'tag-attendee-join';
        case 'room-close':
        case 'room-close-force': return 'tag-room-close';
        case 'room-close-idle': return 'tag-room-close-idle';
        default: return 'tag-default';
      }
    }

    async function refresh() {
      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.style.opacity = '0.6';
      try {
        const d = await api('/api/overview');
        document.getElementById('header-meta').textContent =
          `控制区：${d.controlRegion} · 媒体区：${d.mediaRegion}`;
        document.getElementById('region-tags').textContent =
          `${d.controlRegion} / ${d.mediaRegion}`;
        document.getElementById('c-rooms').textContent = d.roomCount;
        document.getElementById('c-att').textContent = d.attendeeCount;
        document.getElementById('room-badge-count').textContent = d.roomCount;

        const mins = Math.floor(d.uptimeSec / 60);
        const hours = Math.floor(mins / 60);
        document.getElementById('c-up').textContent =
          hours > 0 ? `${hours}h ${mins % 60}m` : `${mins} min`;
        document.getElementById('c-started').textContent =
          `启动于 ${formatTime(d.startedAt)}`;

        const tb = document.getElementById('rooms');
        if (!d.rooms || !d.rooms.length) {
          tb.innerHTML = `<tr><td colspan="6">
            <div class="empty-state">
              <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
              <p>当前暂无活跃房间，可通过上方快速创建</p>
            </div>
          </td></tr>`;
        } else {
          tb.innerHTML = d.rooms.map(r => {
            const idleText = r.idleSec > 0 ? `${r.idleSec}s 前心跳` : '活跃中';
            const attendeesHtml = r.attendees && r.attendees.length
              ? `<div class="attendee-chips">` + r.attendees.map(a => `
                  <span class="user-chip" title="加入时间: ${esc(a.joinedAt)}">
                    <span class="user-chip-dot"></span>
                    ${esc(a.externalUserId)}
                  </span>
                `).join('') + `</div>`
              : `<span style="color: var(--text-muted); font-size: 13px;">无在线成员</span>`;

            return `<tr>
              <td>
                <div class="room-badge">
                  <span class="room-code-num">${esc(r.roomCode)}</span>
                </div>
                <div class="meeting-id-sub">Chime: ${esc((r.meetingId || '').slice(0, 8))}…</div>
              </td>
              <td>
                <span style="font-weight: 700; font-size: 16px; color: ${r.attendeeCount > 0 ? '#34d399' : '#94a3b8'}">
                  ${r.attendeeCount}
                </span>
              </td>
              <td>${attendeesHtml}</td>
              <td>
                <span style="font-size: 13px; color: ${r.idleSec > 60 ? '#fbbf24' : '#94a3b8'};">
                  ${idleText}
                </span>
              </td>
              <td style="font-size: 13px; color: var(--text-muted);">
                ${formatTime(r.createdAt)}
              </td>
              <td>
                <div class="action-cell">
                  <button class="btn btn-glass btn-sm" onclick="copyRoom('${esc(r.roomCode)}')">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                    复制房号
                  </button>
                  <button class="btn btn-danger-glass" onclick="closeRoom('${esc(r.roomCode)}')">
                    强制关闭
                  </button>
                </div>
              </td>
            </tr>`;
          }).join('');
        }

        const ev = document.getElementById('events');
        if (d.events && d.events.length) {
          ev.innerHTML = d.events.map(e => `
            <div class="event-line">
              <span class="event-ts">${formatTime(e.ts)}</span>
              <span class="event-tag ${eventTagClass(e.type)}">${esc(e.type)}</span>
              <span class="event-msg">${esc(e.message)}</span>
            </div>
          `).join('');
        } else {
          ev.innerHTML = '<div class="event-line"><span class="event-msg" style="color: #64748b;">暂无事件记录</span></div>';
        }
      } catch (e) {
        toast('刷新数据失败: ' + e.message, 'error');
      } finally {
        refreshBtn.style.opacity = '1';
      }
    }

    async function createRoom() {
      const input = document.getElementById('new-code');
      const code = input.value.trim();
      try {
        const d = await api('/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(code ? { roomCode: code } : {})
        });
        input.value = '';
        await refresh();
        toast(`✨ 房间 <b>${d.roomCode}</b> 已成功创建`, 'success');
      } catch (e) {
        toast('创建房间失败: ' + e.message, 'error');
      }
    }

    async function closeRoom(code) {
      if (!confirm(`强制关闭房间 ${code}？\n此操作会立即断开所有在线成员连接并停止计费。`)) return;
      try {
        await api('/rooms/' + encodeURIComponent(code), { method: 'DELETE' });
        await refresh();
        toast(`房间 ${code} 已强制关闭`, 'success');
      } catch (e) {
        toast('关闭房间失败: ' + e.message, 'error');
      }
    }

    function copyRoom(code) {
      navigator.clipboard.writeText(code).then(() => {
        toast(`已复制房间号 <b>${code}</b> 到剪贴板`, 'success');
      }).catch(() => {
        toast(`房间号: ${code}`);
      });
    }

    // Enter key creates room
    document.getElementById('new-code').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') createRoom();
    });

    refresh();
    timer = setInterval(refresh, 5000);
  </script>
</body>
</html>
