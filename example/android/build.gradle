buildscript {
    ext.kotlin_version = '2.4.0'

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        // Upgrades AGP's built-in Kotlin runtime. The app intentionally does
        // not apply org.jetbrains.kotlin.android.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { subproject ->
    // Agora 6.6.4 and its iris_method_channel bridge still declare
    // compileSdk 31 internally while their current AndroidX dependency graph
    // requires API 34+. Keep this workaround scoped to the Agora plugin
    // modules; minSdk/targetSdk are not changed.
    if (subproject.name in ['agora_rtc_engine', 'iris_method_channel']) {
        subproject.afterEvaluate {
            subproject.android.compileSdkVersion 37
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
