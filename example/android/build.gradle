buildscript {
    ext.kotlin_version = '2.4.0'

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        // Upgrades AGP's built-in Kotlin runtime. The app intentionally does
        // not apply org.jetbrains.kotlin.android.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { subproject ->
    // Agora's bridge and Tencent's TRTC plugin declare compileSdk 31 even
    // though their current AndroidX dependency graphs require API 34+. Keep
    // this workaround scoped to the affected plugin modules; app minSdk and
    // targetSdk are not changed.
    if (subproject.name in ['agora_rtc_engine', 'iris_method_channel', 'tencent_rtc_sdk']) {
        subproject.afterEvaluate {
            subproject.android.compileSdkVersion 37
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
